<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excluir encomenda — Ateliê do Requinte</title>
  <style>
    :root {
      --bg: #eceae6;
      --panel: #ffffff;
      --line: #9b9b93;
      --line-soft: #c9c7c0;
      --fg: #2b2a27;
      --muted: #6b6a64;
      --danger: #9b1c1c;
      --danger-bg: #fde8e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: min(100%, 380px);
      min-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 2px solid var(--fg);
      border-radius: 18px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 14px 10px;
      border-bottom: 1px dashed var(--line-soft);
    }
    .topbar a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .content {
      padding: 16px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .aviso {
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
    }
    .resumo {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .resumo .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .resumo .valor {
      font-size: 14px;
      font-weight: 700;
    }
    .pergunta {
      margin: 0;
      font-size: 14px;
      color: var(--fg);
    }
    .actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }
    .btn-cancelar,
    .btn-confirmar {
      flex: 1;
      border-radius: 8px;
      padding: 14px 12px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-cancelar {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--fg);
    }
    .btn-confirmar {
      border: 1px solid var(--danger);
      background: var(--danger);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="{% url 'minhas_encomendas' %}">← Excluir encomenda</a>
    </header>

    <main class="content">
      <div class="aviso">Esta ação não pode ser desfeita.</div>

      <div class="resumo">
        <div>
          <div class="label">Cliente</div>
          <div class="valor">{{ encomenda.cliente.nome }}</div>
        </div>
        <div>
          <div class="label">Produto</div>
          <div class="valor">{{ encomenda.produto }} ({{ encomenda.sabor }})</div>
        </div>
        <div>
          <div class="label">Data de entrega</div>
          <div class="valor">{{ encomenda.data_entrega|date:"d/m/Y" }}</div>
        </div>
      </div>

      <p class="pergunta">
        Tem certeza de que deseja excluir esta encomenda?
      </p>

      <div class="actions">
        <a class="btn-cancelar" href="{% url 'minhas_encomendas' %}">Cancelar</a>
        <form method="post" style="flex:1;margin:0;display:flex;">
          {% csrf_token %}
          <button class="btn-confirmar" type="submit" style="width:100%;">
            Excluir definitivamente
          </button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
