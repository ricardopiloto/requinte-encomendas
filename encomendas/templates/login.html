<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Requinte Encomendas</title>
  <style>
    :root {
      --bg: #f6f3ef;
      --ink: #1f1a17;
      --muted: #6b625c;
      --accent: #8b3a2a;
      --card: #fffdf9;
      --border: #ddd4cb;
      --error: #9b1c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #efe6dc 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #e8d5c8 0%, transparent 45%),
        var(--bg);
    }
    .login {
      width: min(100% - 2rem, 22rem);
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      font: inherit;
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 0.4rem;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .error {
      margin: 0 0 1rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.4rem;
      background: #fde8e8;
      color: var(--error);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main class="login">
    <h1>Requinte</h1>
    <p>Entre para gerenciar as encomendas.</p>

    {% if form.errors %}
      <div class="error">Usuário ou senha inválidos. Tente novamente.</div>
    {% endif %}

    {% if next %}
      {% if user.is_authenticated %}
        <div class="error">Sua conta não tem acesso a esta página.</div>
      {% endif %}
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label for="id_username">Usuário</label>
      <input type="text" name="username" id="id_username" autofocus required autocomplete="username">

      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password" required autocomplete="current-password">

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
